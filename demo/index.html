<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>dsh-codex-effort · interactive specimen</title>
  <link rel="stylesheet" href="../src/client/styles.css">
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <div class="demo-page">
    <header class="demo-header">
      <a class="demo-brand" href="#" aria-label="DeepSeek Harness plugin specimen">
        <span class="demo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none">
            <path d="M4.3 9.2c3.8-4.4 11.4-4.1 14.8.7-2.4-.4-4.8.3-7.2 1.4-2.2 1-4.5 1.4-6.4.8l-1.2-2.9Z" fill="currentColor"/>
            <path d="M5.5 13.2c3.5 4.9 10.3 5.3 13.9 1.4-2.6.5-4.7-.1-6.9-1.2-1.6-.8-3.4-1.2-5.1-.9l-1.9.7Z" fill="currentColor" opacity=".55"/>
          </svg>
        </span>
        <span class="demo-brand-name">deepseek <b>HARNESS</b></span>
        <span class="demo-brand-divider" aria-hidden="true"></span>
        <span class="demo-brand-sub">effort control</span>
      </a>
      <div class="demo-header-actions">
        <span class="demo-live"><i aria-hidden="true"></i> live specimen</span>
        <button class="demo-theme" id="themeToggle" type="button" aria-label="Toggle color theme">
          <svg class="demo-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 2.8v2M12 19.2v2M4.5 4.5 5.9 5.9M18.1 18.1l1.4 1.4M2.8 12h2M19.2 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <svg class="demo-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <path d="M19.4 14.8A7.7 7.7 0 0 1 9.2 4.6a7.7 7.7 0 1 0 10.2 10.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="demo-main">
      <div class="demo-intro">
        <span class="demo-kicker">SESSION-AWARE · REAL EFFORT SWITCHING</span>
        <h1>Think a little deeper.</h1>
        <p>一道安静的推理强度滑轨，把 Codex 式的克制带进 DeepSeek Harness 输入栏。</p>
      </div>

      <section class="demo-scene" aria-label="Composer preview">
        <div class="demo-aurora demo-aurora-a" aria-hidden="true"></div>
        <div class="demo-aurora demo-aurora-b" aria-hidden="true"></div>

        <div class="demo-shell">
          <div class="demo-shell-top">
            <span class="demo-chip">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" aria-hidden="true">
                <path d="M4 7.5h16M4 12h11M4 16.5h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
              仿codex速度条
            </span>
            <span class="demo-chip">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" aria-hidden="true">
                <path d="m12 3 2.1 6.9L21 12l-6.9 2.1L12 21l-2.1-6.9L3 12l6.9-2.1L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
              标准模式
            </span>
          </div>

          <div class="demo-composer">
            <div class="demo-draft">
              <span class="demo-placeholder">描述你想构建的内容， / 调用指令， @ 文件或对话</span>
              <span class="demo-caret" aria-hidden="true"></span>
            </div>

            <div class="demo-tools">
              <button class="demo-add" type="button" aria-label="Add attachment">+</button>
              <button class="demo-workspace" type="button">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true">
                  <rect x="4" y="5" width="16" height="14" rx="3" stroke="currentColor" stroke-width="1.6"/>
                  <path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                工作区内修改
              </button>

              <div class="demo-anchor">
                <div class="demo-pop-wrap is-open" id="popWrap">
                  <div class="demo-pop">
                    <div class="dce-pop" id="popup" role="dialog" aria-label="Reasoning effort" data-open="true" data-max="false">
                      <div class="dce-head demo-head-effort">
                        <span class="dce-head-spacer" aria-hidden="true"></span>
                        <span class="dce-title-stack">
                          <span class="dce-title" id="tierTitle" data-max="false">High</span>
                        </span>
                        <button class="dce-icon-btn" id="resetBtn" type="button" aria-label="Reset to default effort" title="Reset to default effort">
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M4.2 8.4A8.1 8.1 0 1 1 3.9 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <path d="M4.1 3.6v4.9h4.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                          </svg>
                        </button>
                      </div>

                      <div class="demo-pane-effort" id="effortPane">
                        <button class="dce-model" id="modelBtn" type="button" title="Change model">
                          <span class="dce-model-name" id="modelName">GPT-6.1 Sol</span>
                          <svg class="dce-model-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="m9.2 6.5 5.4 5.5-5.4 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                          </svg>
                        </button>

                        <div class="dce-slider" id="slider" data-max="false" data-disabled="false" data-dragging="false">
                          <span class="dce-track-base" aria-hidden="true"></span>
                          <span class="dce-fill" id="fill" aria-hidden="true"></span>
                          <span class="dce-aurora" id="aurora" aria-hidden="true" hidden></span>
                          <span class="dce-stars" id="starField" aria-hidden="true" hidden></span>
                          <span class="dce-ticks" id="tickField" aria-hidden="true"></span>
                          <input class="dce-range" id="effortRange" type="range" min="0" max="4" step="1" value="3" aria-label="Reasoning effort" aria-valuetext="High">
                          <span class="dce-thumb" id="thumb" data-max="false" data-dragging="false" aria-hidden="true">
                            <span class="dce-thumb-ring" id="thumbRing"></span>
                          </span>
                        </div>
                      </div>

                      <div class="demo-pane-model" id="modelPane" hidden>
                        <div class="dce-model-list" role="listbox" aria-label="Choose model">
                          <div class="dce-model-group">
                            <div class="dce-group-name">OpenAI</div>
                            <button class="dce-model-row" data-model="GPT-6.1 Sol" data-selected="true" type="button" role="option" aria-selected="true">
                              <span class="dce-model-mark" aria-hidden="true">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 3.2 13.8 8l4.9 1.8-4.9 1.8L12 16.4l-1.8-4.8-4.9-1.8 4.9-1.8L12 3.2Z" fill="currentColor"/></svg>
                              </span>
                              <span class="dce-model-copy">
                                <span class="dce-model-label">GPT-6.1 Sol</span>
                                <span class="dce-model-meta">5 effort levels</span>
                              </span>
                              <svg class="dce-check" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4.8 12.2 4.3 4.2L19.4 5.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                            <button class="dce-model-row" data-model="GPT-6.1 Luna" data-selected="false" type="button" role="option" aria-selected="false">
                              <span class="dce-model-mark" aria-hidden="true">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 3.2 13.8 8l4.9 1.8-4.9 1.8L12 16.4l-1.8-4.8-4.9-1.8 4.9-1.8L12 3.2Z" fill="currentColor"/></svg>
                              </span>
                              <span class="dce-model-copy">
                                <span class="dce-model-label">GPT-6.1 Luna</span>
                                <span class="dce-model-meta">5 effort levels</span>
                              </span>
                              <svg class="dce-check" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="visibility:hidden"><path d="m4.8 12.2 4.3 4.2L19.4 5.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                          </div>
                        </div>
                      </div>

                      <div class="demo-head-model" hidden>
                        <button class="dce-icon-btn" id="backBtn" type="button" aria-label="Back to reasoning effort">
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.8 6.5-5.4 5.5 5.4 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <span class="dce-title" data-empty="true">Choose model</span>
                        <button class="dce-icon-btn" id="closeBtn" type="button" aria-label="Close">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.4 6.4 17.6 17.6M17.6 6.4 6.4 17.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="dce-root">
                  <button class="dce-pill" id="triggerPill" type="button" aria-haspopup="dialog" aria-expanded="true">
                    <span class="dce-pill-surface" aria-hidden="true">
                      <span class="dce-pill-sweep"></span>
                      <span class="dce-pill-light"></span>
                      <span class="dce-pill-motes" id="pillMotes"></span>
                    </span>
                    <span class="dce-pill-aura" id="pillAura" aria-hidden="true"></span>
                    <span class="dce-pill-label">选择推理强度</span>
                    <svg class="dce-pill-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="m6.5 9.2 5.5 5.4 5.5-5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>

              <button class="demo-mic" id="micBtn" type="button" aria-label="语音输入">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
                  <rect x="9" y="3.5" width="6" height="10.5" rx="3" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M6 11.4a6 6 0 0 0 12 0M12 17.5v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
              </button>
              <button class="demo-voice" id="voiceBtn" type="button" aria-label="语音模式">
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none" aria-hidden="true">
                  <path d="M5 10v4M8.5 7.5v9M12 5v14M15.5 7.5v9M19 10v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </button>

              <div class="demo-native">
                <span class="demo-native-name" id="nativeName">GPT-6.1 Sol</span>
                <span class="demo-native-badge">1017</span>
                <span class="demo-native-effort" id="nativeEffort">High</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <button class="demo-send" type="button" aria-label="Send">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
                  <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <div class="demo-footer">
        <span><kbd>拖拽</kbd> 调整强度</span>
        <span><kbd>悬停</kbd> 光感跟随</span>
        <span><kbd>Esc</kbd> 收起</span>
      </div>
    </main>
  </div>

  <script defer src="./demo.js"></script>
</body>
</html>
